site_name: FSFG2026
site_url: https://fsfg-jp.github.io/FSFG2026/

nav:
  - ホーム: index.md
  - 参加登録: registration.md
  - リンク: link.md

theme:
  name: cosmo
  locale: ja
  custom_dir: overrides   # 左の目次を消す (overrides/main.html)

markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - include-markdown
